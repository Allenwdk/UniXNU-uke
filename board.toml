# Board description of the Xiaomi Pad 7 (uke, SM7675), read by the unixnu build driver.
schema_version = 2

# Uke prepares signed runtime assets explicitly, reusing its preserved Data seed.
[payload.runtime]
enabled = false

[payload.runtime.launchd_job_environment."com.apple.iconservices.iconservicesagent"]
FORCE_SOFTWARE_RENDERER = "0"
CI_ENABLE_METAL_GPU = "0"

[board]
name = "uke"
soc = "SM7675"
soc_source = "sm7675"
os_profile = "ipados-27.0.1-24A446"
description = "Xiaomi Pad 7"
kit = "uke"                      # the package/ of this repository appears as kits/uke in the build tree

# iPadOS 27 GPU integration: the shared platform, kernel and
# keystore pieces only. Storage, display, input and GPU join as their iPadOS 27
# archives are selected (the resolver requires an archive entry for every selected
# component with a kernel-stage recipe).
[components]
include = [
  "ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "AppleKeyStoreState",
  "Adreno740", "AdrenoMetal", "AdrenoFirmware", "AdrenoPM4", "ArmSmmu4K", "AirNir", "Sm7675Platform",
  "GopFramebuffer", "QcomGeniSpi", "ShengNovatekTouch", "ShengHidInput",
  "ShengUfs", "VirtioMmioBlock", "RamBlock", "VerifiedRoot", "SoftwareAES", "Ath12kWifi",
]

# The target OS image comes from the `ipados-27.0.1-24A446` profile (iPad17,3 / J820AP,
# iPadOS 27.0.1 24A446). Give --ipsw PATH to use a local file; without it the remote url is
# read with range requests, only the members that are needed.

# The raw image for the userdata partition: the OS and SystemOS disk images of the IPSW behind a manifest.
# first_lba and last_lba are the GPT entry "userdata" of LUN 0, read from the tablet.
[userdata]
first_lba = 0x2d3000
last_lba = 0x3b147fa
lba_bytes = 4096
# ShengUfs requires distinct OS and SystemOS windows; both are present in 24A446.
# Raw hash tables only: --object OS.vroot=<OS>/manifest.bin:544 and SystemOS.vroot=<SystemOS>/manifest.bin:544.
# The signed 544-byte headers travel separately as kernel.macho.vroot.
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "uke_ipados27_defconfig"
# The four-layer series of the resolver: shared arch patches, the SoC platform
# patches, the OS patches and the board's own. The arm64e profile supplies the
# shared arch series and the 24A446 profile the OS series; the SoC and device
# series are re-based on xnu-12377 in their own repositories.
config_fragments = ["arch:configs/common.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu-12377/series", "os:patches/xnu/series", "device:patches/xnu-12377/series"]
# Archive builders of the kernel step, in order. They run only for a configuration with
# CONFIG_XNU_BUILD_ARCHIVES=y (uke_ipados27_defconfig). This is the first link gate: the shared
# source archives only. The source-storage, display, HID and boot-log builders are added here as
# their iPadOS 27 ports land.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  "component:AppleKeyStoreState",
  # Reuse full SoftwareAES; the next builder qualifies the actual 24A446 PAC/size ABI.
  "component:SoftwareAES",
  "build-software-aes-27.py",
  # Source storage: ShengUfs against the public IOStorageFamily, the Data RAM block and the verify target.
  "component:VirtioMmioBlock",
  "component:ShengUfs",
  "component:RamBlock",
  # Compile the source HID adapter before binding it to the original 24A446 IOHIDDevice.
  "component:ShengHidInput",
  # Upstream fixed-address display/HID adapters are relocated by XnuPrelink.
  "prepare-uke-gmu.py",
  "component:Adreno740",
  "build-adreno740-kits.py",
  "build-adreno740-accelerator.py",
  "build-native-legacy-display-27.py",
  # Match the stripped Apple kernel against the real upstream RELEASE/LTO reference.
]

# Adreno 732 (uke) board values for the native GPU driver. The driver carries
# an A740 and an A732 profile; scripts/check-uke-gpu.py compares these values
# with a device DT dump, and scripts/prepare-uke-gmu.py turns the recorded DT
# facts into the headers NativeAdreno consumes. The catalog values are from
# MCC45TR/senemos-uke-kernel-mainline patch 0036 (public A732 entry), not a
# device run.
[gpu]
model = "Adreno732"
chip_id = "0x43030b00"
compatible = "qcom,adreno-gpu-gen7-11-0"
family = "ADRENO_7XX_GEN2"
gpu_base = "0x3d00000"
gpu_size = "0x40000"
gmu_base = "0x3d68000"
gmu_size = "0x37000"
gmu_pdc_base = "0xb280000"
gmu_pdc_size = "0x10000"
gpucc_base = "0x3d90000"          # qcom,cliffs-gpucc
gpucc_size = "0xa000"
gcc_base = "0x100000"             # qcom,cliffs-gcc
smmu_base = "0x3da0000"
smmu_size = "0x40000"
sid_user = 0x00
sid_secure = 0x02
sid_gmu = 0x05
gmem_bytes = "0x180000"           # 1.5 MiB
gmu_chip_id = "0x70b0000"         # a6xx_info.gmu_chipid for 0x43030b00
gmu_cgc_mode = "0x00020202"
preempt_record_bytes = "0x225000"  # 2196 KiB
# Reserved GMU payload pool: physical pages the driver adopts over IODeviceMemory::withRange
# instead of allocating from the kernel VM after userland has wired it. Must match the ADT's
# gmu-memory node (scripts/make-uke-adt.py) and the "GMU Pool" entry of the uke UEFI memory map.
gmu_pool_base = "0xc8000000"
gmu_pool_bytes = "0x2000000"
ubwc_version = 4
ubwc_swizzle = 6                  # levels 2 and 3
highest_bank_bit = 16
gmu_core_clock_hz = 220000000     # GMU core clock target for the A732
gmu_hub_clock_hz = 200000000
# Collected from the rooted device on 2026-10-21. The firmware is gen71100
# (matching compatible qcom,adreno-gpu-gen7-11-0), not the gen71500 sibling.
frequencies_mhz = [950, 900, 835, 736, 684, 633, 500, 353, 255]
num_pwrlevels = 9
initial_pwrlevel = 8
min_pwrlevel = 8
max_pwrlevel = 0
firmware_sqe = ["gen71100_sqe.fw", "gen71500_sqe.fw", "a732_sqe.fw"]
firmware_gmu = ["gen71100_gmu.bin", "gen71500_gmu.bin", "a732_gmu.bin"]
firmware_zap = ["gen71100_zap.mbn", "gen71500_zap.mbn", "a732_zap.mbn"]
firmware_source = "/vendor/firmware + /odm/firmware"

[gpu.system_cache]
default_mode = 2
compatible = "qcom,cliffs7-llcc"
version = 50
base = "0x25000000"
bytes = "0x800000"
broadcast = "0x25800000"
broadcast_bytes = "0x200000"
gpu_slice = 9
gpu_capacity_kib = 3200
gpuhtw_slice = 11
gpuhtw_capacity_kib = 256

[gpu.firmware_pins."gen71100_sqe.fw"]
bytes = 66036
sha256 = "b6df660d109504dbea5a266910b037a33d893a11c6de52f524a5fd112008c401"

[gpu.firmware_pins."gen71100_gmu.bin"]
bytes = 80680
sha256 = "435c7bac9a328b8a100df930b84b65b4d579e42be44785d0e60e3729291bb864"

[gpu.firmware_pins."gen71100_zap.mbn"]
bytes = 12088
sha256 = "1294992888e8c7c7fcd8a6d0a672cc666eff3c95e666ce5840db7e03edcc500d"

# The kernel prelink input (tool, kernelcache sha, slide, early_security_init and roots) comes from
# the `ipados-27.0.1-24A446` profile: the 24A446 kernelcache is an MH_FILESET with stripped symbols,
# so the profile's XnuPrelink emitter and fileset-reference path apply instead of the 21H461 values.

# Use the content-pinned Apple-clang RELEASE/LTO comparison from Actions run
# 41449626495. Rebuild that reference when its XNU/SDK/archive inputs change.
[kernel.prelink]
# Owner-authenticated SystemOS startup replaces Apple-hardware Ignition preparation.
# Retain Image4 code as a dependency; do not start its hardware-key service.
roots = ["com.apple.AppleFSCompression.AppleFSCompressionTypeZlib", "com.apple.driver.AppleARMPlatform", "com.apple.driver.AppleARMWatchdogTimer", "com.apple.driver.AppleAudioClockLibs", "com.apple.driver.AppleEffaceableStorage", "com.apple.driver.AppleIISController", "com.apple.driver.AppleM2ScalerCSCDriver", "com.apple.driver.AppleMobileFileIntegrity", "com.apple.driver.ApplePMGR", "com.apple.driver.IODARTFamily", "com.apple.filesystems.apfs", "com.apple.iokit.CoreAnalyticsFamily", "com.apple.iokit.IOAVFamily", "com.apple.iokit.IOAudio2Family", "com.apple.iokit.IOCECFamily", "com.apple.iokit.IOCryptoAcceleratorFamily", "com.apple.iokit.IOGPUFamily", "com.apple.iokit.IOHDCPFamily", "com.apple.iokit.IOMobileGraphicsFamily", "com.apple.iokit.IOReportFamily", "com.apple.iokit.IOSlowAdaptiveClockingFamily", "com.apple.iokit.IOStorageFamily", "com.apple.iokit.IOSurface", "com.apple.kec.Libm", "com.apple.kec.corecrypto", "com.apple.kext.AppleMatch", "com.apple.kext.CoreTrust", "com.apple.security.AppleImage4", "com.apple.security.sandbox", "com.apple.iokit.IOHIDFamily", "com.apple.iokit.IOHIDEventDriver"]
extra_args = ["--fileset-reference", "refer/apple-fileset-reference/2f9eabe43241bb9b64d367151d79d660e81e3ec7fee8399c3f37a0f5ba3b5aa8.macho", "--allow-missing"]

[firmware]
config = "uke"                   # Resources/Configs/uke.toml in the Mu-Silicium checkout (--uefi)
dsc = "Platforms/Xiaomi/ukePkg/uke.dsc"
fd = "Build/ukePkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-uke.py"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "uke"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "uke-research"

# The ramdisk of the boot image: a FAT volume with the UniXNU config, the kernel, its device tree and
# the optional trust cache and Data seed. The loader (DarwinBoot) is part of the firmware volume.
[payload]
# Exact original 24A446 StaticTrustCache + SystemTrustCache modules.
# Original modules remain byte-for-byte; the historical 21H461 owner bundle is not an input here.
trust_cache_sha256 = ["dc655bcb2ddfaea214f9ec83659b3fc8d8b658bafac2b5a004fb4179a25c89bf"]
volume = "UKEESP"
# The 24A446 fileset kernel is ~91 MiB; the stock vendor_boot partition is 96 MiB, so the FAT volume
# sits near the ceiling (payload + DTB + table must stay under it).
size_mib = 160
compression = "uefi"
# Historical FAT geometry/split workarounds are retained for this diagnostic to avoid changing
# multiple boot inputs. The old 65,536-cluster truncation explanation was withdrawn after the
# ABL initrd/DXE heap overlap review; see docs/status/initrd-lifetime-review-2026-11-02.md.
loader = "firmware"
title = "uke first boot: source 4K XNU to console"
dram_size = "0x240000000"            # XNU VM DRAM: the full 9 GiB high range (0x8C0000000-0xB00000000)
dram_base = "0x8C0000000"            # high DRAM range 0x8C0000000-0xB00000000; the ADT writes /chosen/dram-base
skip_setup_tool = "scripts/seed-data-skip-setup.py"   # used by --skip-setup
# On: the panic screen draws a panic that happens before the video console exists. Every panic before
# this was invisible on uke (no UART); the screen costs one text cave in the kernel image.
panic_screen = true
# The signed root-policy bundle (build-sheng-source-storage.py): with XNU_SOURCE_STORAGE_TABLES=userdata only the
# 544-byte headers travel here as kernel.macho.vroot; the hash tables live in the userdata image as OS.vroot.
root_policies = "{tree}/build/sheng-source-storage/root-policies.bin"
# 24A446 CPU compositor: register IOSurface-backed SW surfaces through the original
# Context::track_surface before the first push. Original bytes must match; the
# signature validator and original factory/NULL/retain/PAC paths remain in use.
text_fixups = [
  "dyld_shared_cache_arm64e.01,42c8718,7f2303d5f85fbca9f65701a9f44f02a9,7f2303d55a9b0414f65701a9f44f02a9",
  "dyld_shared_cache_arm64e.01,43ef484,00000000000000000000000000000000,f37bbfa9f30300aa9e0000107f2303d5",
  "dyld_shared_cache_arm64e.01,43ef494,00000000000000000000000000000000,f85fbca9a264fb17c00000b4e10300aa",
  "dyld_shared_cache_arm64e.01,43ef4a4,00000000000000000000000000000000,e00313aaf30301aa7f68f497e00313aa",
  "dyld_shared_cache_arm64e.01,43ef4b4,0000000000000000,f37bc1a8ff0f5fd6",
]

# NativeAdrenoMetal is delivered by the matching --gpu-addon and --owner-trust-cache inputs.
kernel_args = [
  "-v",
  "serial=3",
  # Decimal334 is the same debug mask as0x14e; keeps the full arguments below1000B.
  "debug=334",
  # uke has no UART: kprintf goes to the framebuffer video console.
  # Show XNU text; kprintf enqueues rather than drawing with interrupts masked.
  "-uketextconsole",
  "-ukedeferredconsole",
  "-enable_kprintf_spam",
  "sheng-gpu-power=9",
  "sheng-gpu-metal=1",
  "sheng-gpu-preempt=2",
  "sheng-gpu-dcvs=1",
  "sheng-fb-gpu=1",
  "sheng-fb-bgra=1",
  "sheng-gpu-addon=1",
  "kt_fixed_zones=120",
  # Original display family with GPU composition and fence-controlled GOP/DPU presentation.
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-unit-scale=2",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-legacy-phase=4",
  # Absent uses the driver's zero default, preserving console output.
  # Input: touch at stage 4, HID reports, polled frame path.
  "offline-hid-home=1",
  "offline-hid-input=1",
  "sheng-touch=4",
  "sheng-touch-hid=1",
  # Backboardd accepts a Digitizer/Touch Screen service, not keyboard-first HID.
  "sheng-touch-split=1",
  "sheng-touch-poll=1",
  # Display client, APFS load and the display refresh tick.
  "offline-mobile-graphics-client=1",
  "offline-mobile-graphics-load=1",
  "offline-apfs-load=1",
  "boot-progress=2",
  "-apfs_shared_datavolume",
  "offline-key-events=1",
  "sheng-dpu-scanout=2",
  "sheng-vsync=120",
  "sheng-vsync-fixed=1",
  # Storage: source-storage UFS root (the 24A446 OS policy travels as kernel.macho.vroot and OS.vroot).
  "native-source-storage=1",
  "sheng-data-persist=2",
  # Existing UKELLOG1 writer: recovery reads the last 32 MiB of userdata.
  "sheng-log=1",
  # Periodic full CrashReporter scans are optional; normal frame tracing/export remains.
  "native-ufs-root=1",
  # Existing upstream detail screen for the next root-preparation failure.
  # Board policy carried over from the 17.7.11 line.
  "sheng-lite=1",
  # Staged apps and unencrypted Data metadata use the upstream board defaults
  # in BootWatchdogPolicy.c; explicit boot arguments can override them.
  "sheng-aks=1",
  "sheng-disable-watchdogd=1",
  "sheng-smp=1",
  "sheng-cpufreq=4",
  "armcpu-spi-ipi=1",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  "use_contiguous_hint=0",
]
# The existing 24A446 SW surface fixups remain available to software clients.

[payload.adt]
tool = "scripts/make-uke-adt.py"
chip_id = "207"
owned_memory_size = "0x130000000"     # 4.75 GiB, sheng's proven value on the same 12 GB RAM class; fits the 9 GiB
                                      # high-bank run (0x8C0000000..0xB00000000) now mapped in uke's MemoryMapLib
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
packed_data_ramdisk = true
persistent_data = true               # sheng-data-persist keeps Data writes, so Data is not ephemeral storage
ipad_identity = true
unique_chip_id = "required"          # the platform seed is not stored in any repository

# Image parameters come from the Mu-Silicium device config; [bootimg.image] would override them.

# The stock ABL powers the panel off when the device tree has no splash region, so add it.
[bootimg.image]
header_version = 4
base           = 0x00000000
kernel_offset  = 0x00008000
tags_offset    = 0x01e00000
pagesize       = 4096

[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region"
props = [
  { name = "label", type = "s", value = "cont_splash_region" },
  { name = "reg", type = "x", value = ["0x0", "0xe3940000", "0x0", "0x2b00000"] },
]

# The boot image has no ramdisk. The payload is the vendor_boot vendor ramdisk,
# which the ABL loads at 0x1000000; UkeBootMemoryDxe publishes this range as
# the FAT volume the boot manager scans.
[[bootimg.dtb_node]]
path = "/chosen"
props = [
  { name = "linux,initrd-start", type = "x", value = ["0x1000000"] },
  # The 24A446 payload is 94 MiB (0x5E00000) at 0x1000000; UkeBootMemoryDxe publishes this range as the
  # FAT volume, so the end must cover it (the 17-line image said 0x6000000 for an 80 MiB payload).
  { name = "linux,initrd-end", type = "x", value = ["0xe000000"] },
]

[device_tree]
source = "device:dts/uke.dts"
include_dirs = ["soc:dts"]

# Board ADT overrides on top of the OS profile identity (the make-uke-adt.py
# baseline). The panic log and the GMU pool ride as top-level nodes.
[adt.chosen.u32]
# No Apple CTRR on this board; XNU TUNABLES requires an explicit 32-bit value.
# 0 truthfully describes absent CTRR, rather than claiming hardware text lockdown.
kernel-ctrr-to-be-enabled = 0
embedded-panic-log-size = 0x380000

# Owner image-set identity, derived from the fully verified signed OS/SystemOS policies.
# This is explicitly owner-domain metadata, not an Apple ticket identity.
[adt.chosen.bytes]
# The configured en0 address, consumed by original MobileGestalt Wi-Fi capability.
mac-address-wifi0 = "020000756750"
boot-manifest-hash = "148316f0bb4484b19cda323503ffcb454fcc96d089087cd1f140725337c7cb8c435b86e560c193df76821ca121e262e9"
owner-boot-manifest-domain = "5665726966696564526f6f742e4f776e6572426f6f745365742e763100"

[adt.defaults.u32]
sleep-disabled = 1
"kern.maxvnodes" = 0x13400
# No Apple PMGR or SEP: report a virtual platform, so AMFI does not wait for an ApplePMGRNub and the
# native UFS root needs no PMGR stand-in (sheng's iPadOS 27 board does the same).
"vmm-present" = 1

[adt.product.string]
model = "xiaomi,uke"
artwork-display-gamut = "sRGB"

[adt.product.u32]
thin-bezel = 1

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

[adt.pram.bytes]
reg = "000080ff000000000000380000000000"

[adt.gmu-memory.bytes]
reg = "000000c8000000000000000200000000"
