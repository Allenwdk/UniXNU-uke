  { kind = "host", reference = "docs/WIFI-WCN6750.md", result = "Offline WLAN MSA stage-1 plan with real IDR values: ArmSmmu4KBuild accepts identity 0xa6400000+0xc00000 (8 table pages, 3072 leaves, start level1); ArmSmmu4KEncodeContext yields CBAR=0001f300, CBA2R=1, TCR=8080351c, TCR2=00038011, MAIR0=0000ff44, SCTLR=00001067, TTBR0=1000080000000. No hardware write; table pool and activation remain to be implemented.", command = "gcc ... wlan-msa-plan.c ArmSmmu4K.c ArmSmmu4KContext.c && /tmp/wlan-msa-plan", revision = "8f3973749f8868c2b5ad603705a6d748c46b1785" },
