  { kind = "device", reference = "docs/INPUT-BACKLIGHT-20261110.md", result = "2026-11-10 22:16:11 +0800 按本轮授权部署锁屏黑帧候选 `871557F1A96ECDE1`，vendor_boot SHA-256 `8673a24f72041643f12ead7ed5d8917f1b55fc777ded12b7e23f37669f7f3172`。70 项归档校验和、13 区预检通过。四分区写入成功，A 槽已回读，重启命令成功。主机未写擦 userdata。锁屏花屏及亮屏回归待实机反馈。证据 `uke-port/releases/2026-11-10-backlight-blank-scanout/flash-result-20261110-221602.json`。", command = "fastboot flash four partitions; set_active a; getvar current-slot; reboot", revision = "c38a4a429dd2fd46b174cbcac11902fff602b89c" },
  { kind = "host", reference = "docs/INPUT-BACKLIGHT-20261110.md", result = "871557F1A96ECDE1 正式构建与主机核验通过，vendor_boot SHA-256 8673a24f72041643f12ead7ed5d8917f1b55fc777ded12b7e23f37669f7f3172。纯黑提交先填满 GOP 再切 DPU，锁存后报告完成。已知未锁存时保留旧槽。实机待验，证据 uke-port/releases/2026-11-10-backlight-blank-scanout/build-result.json。", command = "formal kernel/payload; GOP blank and fence ASan/UBSan; PAC/FAT", revision = "c38a4a429dd2fd46b174cbcac11902fff602b89c" },
  { kind = "device", reference = "docs/INPUT-BACKLIGHT-20261110.md", result = "用户在 4A0A0C61C9B6C392 确认亮屏没有可见延迟，锁屏约 0.1 秒花屏后完全熄灭。801 个新有效尾环槽记录 10 次关屏的黑帧填充完成均早于关背光请求，双片关断回读耗时 0.727–0.987 ms。10 次唤醒 8 次等到表面完成、2 次走 200 ms 兜底。设备原厂四分区/A 槽/TWRP，只读回收。", command = "user feedback and read-only tail/Data recovery", revision = "c38a4a429dd2fd46b174cbcac11902fff602b89c" },
