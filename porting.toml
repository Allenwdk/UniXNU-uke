next_action = ["Candidate 1BF4587AE6964D6F is built and packaged but not flashed. It sets this chip's .idle_ps to false in tools/prepare-ath11k.py, so ath11k_mac_op_start no longer sends WMI_PDEV_PARAM_IDLE_PS_CONFIG (44) and the firmware is not authorised into the low power recipe this port cannot service. The next device round must read, in order: the 'ath11k debug mask 00000076' line; that 'wmi cmd pdev set param 44' is gone; whether 'htc ep 2 credits got' and 'msi vector 2' resume after 'wmi cmd vdev create'; and if they do, the vdev set param 48/91/34 lines and 'cmd start scan'. If the firmware still asserts in whal_wmac_transition_to_fw_control, IDLE_PS was not the only entry into the recipe and the next candidate should look at vdev_start_delay and any other PM authorisation the host sends."]
