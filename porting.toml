[[area]]
id = "memory"
status = "device-verified"
components = ["RamBlock"]
paths = ["board.toml", "dts/uke.dts"]
inputs = ["High DRAM window at 0x8C0000000 sized 0x240000000 (9 GiB) with the owned window at 0x130000000.",
  "GMU pool 0xC8000000/32 MiB reserved in the UEFI map and adopted over IODeviceMemory::withRange."]
configuration = ["[payload.adt]: owned_memory_size 0x130000000, chip_id 207, cpu_regs 0..0x700, boot-manifest-hash pinned.",
  "dts/uke.dts memory node: one contiguous range, as the ADT hand-off requires."]
procedure = ["Build the payload and read the UKE MEM counters from the menu and the kernel log."]
findings = ["owned_memory_size, not dram_size, sizes the XNU VM; the 320 MiB ceiling was lifted by the static high-bank MemoryMapLib entries (UKE MEM ~1.11M 4K pages, free ~645 MiB).",
  "A sheng-style external abort can appear at the 6 GiB top; the full 6 GiB board map is configured in board.toml."]
completion = ["The kernel owns the 4.75 GiB window and jetsam no longer fires at the old ceiling."]
limits = ["Host-only verification of the migrated ADT; the on-device counters come from the pre-migration images."]
next_action = ["Re-read the UKE MEM counters after flashing the format-2 image."]
evidence = [
  { kind = "device", reference = "docs/PROGRESS.md", result = "UKE MEM ~1.11M 4K pages with free ~645 MiB; no jetsam past t=538s where earlier runs died at ~500s", command = "fastboot boot boot.img", revision = "c77d613dc91fb54479242aa5d5902c48662b80d7" },
  { kind = "host", reference = "board.toml", result = "the generated ADT matches the make-uke-adt.py baseline: identical chosen, cpus, defaults, pram and gmu-memory", command = "python3 scripts/make-uke-adt.py (baseline diff)", revision = "23c2926941405e7df8097a6bca6ee8348a39c787" },
]

