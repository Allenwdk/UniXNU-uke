[[area]]
id = "network"
status = "implemented"
components = ["Sm7675Platform", "Ath12kWifi"]
paths = ["board.toml", "feeds.toml", "package/Wifi*.c", "package/WifiProbe.cpp", "package/UkeWpss.h", "package/UkeWpssMemory.h", "package/AdspFirmware.c", "firmware/wcn6750/**", "scripts/check-uke-wifi-firmware.py", "scripts/check-uke-wifi-assets.py", "scripts/*wcn6750-qmi.py", "scripts/build-native-legacy-display-27.py", "docs/WIFI-WCN6750.md"]
inputs = ["Stock WCN6750 signed WPSS pieces from the read-only modem_a firmware partition, pinned in firmware/wcn6750/manifest.json.",
  "Uke live DTS: WPSS25MiB at0x9bb00000, MSA12MiB at0xa6400000, SMEM GLINK/IPCRTR remotePID13 and IPCC client24; PAS6.",
  "DMA ownership (porting/platform): apps_smmu@15000000 stream SID0x1400 mask1, IOVA pool0xb0000000+0x10000000, MSI doorbell0x17110040 and SPI0x300-0x31f, dma-coherent; BAR0x61e00000+0x200000 from DEVICE_INFO.",
  "Official layering target (porting/network): nw_abi lx_platform/nw_board -> nw_wifi worker -> WifiProbe hardware -> WifiNet OS. Ath12kWifi contains no WCN6750 board; the ath12k PCIe/MHI worker cannot be selected unchanged."]
configuration = ["WPSS control worker is linked through the 24A446 Legacy board archive; uke-wifi defaults to mode3 (ath11k AHB data path) with explicit uke-wifi=0/1/2 override. Existing999-byte boot line and GPU addon are preserved.",
  "The Legacy archive links the pinned Linux QMI codec and original ath11k CAP/DEVICE_INFO descriptors. The board owns the QRTR client port and validates the response bounds before decoding.",
  "Shared CX/MX maximum cmd-db votes and XO are retained by this diagnostic. Runtime vote ownership, WifiNet/Apple80211 and the userspace supplicant remain pending.",
  "The stack runs under the module's own lifecycle: nw_wifi.c is built with NW_PLATFORM_AHB (PCI/MHI/QRTR-MHI and the ath12k diagnostics are compiled out), nw_ahb.c supplies the platform object model, and nw_diag_ahb.c provides nw_wifi_ring_state/rx_state/tx_reasons/link_state from ath11k structures. The board only fills struct nw_board, calls nw_wifi_start/step and reads nw_wifi_ring_state.",
  "org.unixnu.wifi.control is registered as a privileged extended kernel control (ctl_sendsize 256KiB, ctl_recvsize 512KiB) with connect/disconnect/send/getopt/rcvd callbacks ported from sheng; the transport's send uses ctl_enqueuedata and wake wakes the WPSS worker. A single self-test session issues NW_CONTROL_INFO so the queue path is proven before userspace exists.",
  "The OS network side is sheng's WifiNet.cpp kept byte-identical: it publishes en0 and the Apple80211 ioctls, installs nw_wifi_events and owns RX/TX. Its IO80211/IONetwork classes register late through ukeClassBegin/ukeClassEnd around __GLOBAL__sub_I_WifiNet.cpp, driven from the board once nw_wifi_stats.stage reaches 4. The ADT that make-uke-adt.py generates now carries /arm-io/wlan (compatible qcom,wcn6750, local-mac-address 02:00:00:75:67:50) for 24A446's wifid, and patches/xnu-12377/uke-wifi-association-event.patch lets kev_post_msg carry the 540-byte association result in a cluster mbuf (Apple IEEE80211 class only).",
  "ath11k debug output is the driver's own: ath11k_debug_mask defaults to 0x76 (WMI|HTC|MAC|BOOT|QMI) and the boot argument ath11k-debug-mask=<n> overrides it. The shim lx_log also expands the %s-prefixed va_format shape __ath11k_dbg uses, so debug lines keep their mask name instead of printing a pointer. No board-side WMI/HTC trace is added."]
procedure = ["./unixnu build kernel && ./unixnu build payload",
  "python3 ../UniXNU-uke-build/scripts/check-uke-wifi-firmware.py --protocol-dir ../UniXNU-sm7675-common/kits/Sm7675Platform/remoteproc",
  "Official order: prove platform interrupts and DMA ownership first, then lx_platform/nw_board callbacks, then the worker, then the OS interface. WCN6750 follows the same layers with an ath11k AHB/hybrid backend.",
  "After current flash authorization, inspect fresh UKE WIFI stage/ready/IPCRTR/WLFW and board-data logs before adding the DMA/MSI path."]
findings = ["2026-11-09 identity/touch branch changes only HID feed provenance; HID tracked code and Wi-Fi/GPU runtime sources unchanged. V4.9.7 main baseline preserved. No new association,traffic,lifecycle or device acceptance inferred.",
  "2026-11-08 V4.9.3 host repair: pollGl now calls nw_wifi_poll on each worker/nested pump as sheng6894001 pPoll does. Level7 per-channel/per-buffer debug filtered and recent16 debug hashes deduplicated; warnings/errors and native control diagnostics retained. CTLWORK v493 counts poll/gapmax/stepmax/logdrop. A single focused ASan/UBSan fixture compiles the production board callback slice with real nw_control/lx_rt: missing-poll control exceeds3000ms without dispatch, fixed reply95ms, mutex-held work deferred until unlock, MSI/GLINK and repeated errors preserved. These timings are simulated, not device measurements. Formal kernel and payload pass; runtime source delta vs V4.9.2 is only kits/uke/WifiAth11k.cpp SHA e9160fbb7e113041961839548a6ddadcd5ee37c6a3b684e22ddc344cb86c6501. No userspace/WPA/AMFI/trust/firmware/DMA changes. Networking and Settings remain unverified; no flash or host userdata write. Workspace report docs/status/wifi-v49-3-worker-poll-2026-11-08.md.",
  "2026-11-08 V4 device readback: everything up to the supplicant works - UKE WIFI BIN stage=5 status=0 (the addon binary is mounted at /usr/libexec), the control self-test passes, wifid[50] runs, and a join arrives as layout 656 with key length 0 cipher 0 (an open join, because the supplicant never attached). The supplicant does start: launchd spawns it (PIDs 44/103/108/116/131/147/183/193/204/219) and every spawn is refused by AMFI with 'Launch Constraint Violation (enforcing), error info: c[8]p[1]m[1]e[6], (Constraint not matched)' for /usr/libexec/unixnu-wpa_supplicant, launch type 1. Six corpses, no control session. iOS 27 enforces launch constraints on system-service launches and an ad-hoc signature carries none. The AMFI kext in the kernelcache exposes amfi_enforce_launch_constraints and amfi_allow_3p_launch_constraints, so the narrow switch is amfi_enforce_launch_constraints=0 rather than the global amfi=0x80. Boot arguments were at 999 bytes, so sheng-diag=4, sheng-gpu-trace=2 and -enable_kprintf_spam were dropped to land at 981 bytes.",
  "2026-11-08 V4: the native wpa_supplicant cannot be built on the Linux host (the iPhoneOS userland SDK, xcrun and codesign only exist on macOS; tools/build-supplicant.py --target ios stops at a missing stdlib.h). It is now built by a dispatch-only macOS workflow in the device repo (.github/workflows/build-wifi-supplicant.yml) from UniXNU/Ath12kWifi at 28de7b9, ad-hoc signed with identifier org.unixnu.wifi.supplicant, and uploaded with its CDHash. The Linux side computes the same CDHash from the Mach-O (LC_CODE_SIGNATURE -> CodeDirectory -> sha256[:20]) because this host's codesign port verifies signatures but prints nothing for --display; the CI value 2941c69fcc5c43148546935e5cebc0f03ce9cf4b matches the parsed one.",
  "2026-11-08 V4 packaging: build-wifi-userspace.py stages bin/etc/wifi/daemons without firmware (the driver reads the stock modem partition); the supplicant job is merged into the icon-service launchd cache (716 jobs, icon environment intact, one added owner job, detached signature regenerated) so no second /System/Library/xpc mount is needed; uke-wifi-launchd-cache.patch adds only the /usr/libexec union mount (scratch 0xc00, launchd_cache_loader stays visible); the addon gains wifi-bin/unixnu-wpa_supplicant + etc/wifi + the new xpc cache, and trust-append-module.py adds the supplicant and cache CDHashes (4 -> 5 modules). unixnu.local.toml now points gpu_addon/owner_trust_cache at the fixes directory inputs.",
  "2026-11-08 V3.1 device result: the missing piece was wifid's launch condition, not the driver. Its launchd job (/System/Library/LaunchDaemons/com.apple.wifid.plist in the shipped cache: RunAtLoad, KeepAlive, Program /usr/sbin/wifid) carries _LimitLoadToDeviceTree = [wlan, marconi-wifi, centauri-alpha, centauri-alpha-protium], and it is the only Wi-Fi daemon with that key. The check runs against the device tree the boot image supplies; sheng's [bootimg] dtb comes from sheng.dts, whose root level carries wlan, while uke.dts had no such node (V3 had only added the ADT /arm-io/wlan). Adding the root-level node from sheng verbatim (compatible qcom,wcn7850, status okay) plus an ADT mirror made /usr/sbin/wifid[49] start, and the user confirmed Control Center shows Wi-Fi and scans real networks. The readback covers kCardCaps(34), kPower(25), kScanReq(3 OK), kScanResult(42), kCurrentNetwork(144, ENOENT while unassociated), kSupportedChannels, kHwSupportedChannels(19), kCountryCode(7); newer types 25/96/97/106/115/207/365/389/390/423/473/481/485/512/560/564/566/571/572/575/582 answer EOPNOTSUPP.",
  "2026-11-08 V3.1 Settings surface: Preferences[398] started and loaded no Wi-Fi panel extension at all (no WiFiSettingsControlsExtension/WiFiKit/MobileWiFi line), so the absent Settings row is not a disable switch: the sheng-lite list (BootWatchdogPolicy.c) contains no Wi-Fi daemon, sheng-disable-jobs is not used, the shipped launchd cache keeps all 715 stock jobs, and wifid's DT gate is now satisfied. The only OS-level complaint is Protobox: wifid(49) deny(1) iokit-open-service IO80211Interface, which the WifiNet design (sheng verbatim) expects: it serves daemons on the ioctl path and answers newUserClient with kIOReturnUnsupported. Whether the Settings pane needs a real IO80211InterfaceUserClient has no log evidence yet and is a separate diagnosis.",
  "2026-11-08 V3 adds the OS layer. WifiNet.cpp is sheng's file byte-identical (52,547 B) with only its three board services replaced: native_wifi_logf prints through the board, sheng_wifi_file answers ENOENT (this device has no join.txt source, so autoJoin disables itself), sheng_wifi_wake is the AHB worker wake. Registration follows the established uke late-class pattern (globalise __GLOBAL__sub_I_WifiNet.cpp, drop __DATA,__mod_init_func, run it inside ukeClassBegin/ukeClassEnd), triggered from the workstation loop once nw_wifi_stats.stage reaches 4 so the MAC is already published. Two more keep-list entries were required (nw_wifi_buffer_stats_get, nw_wifi_power): WifiNet lives in the same archive and objcopy renames every non-kept global.",
  "2026-11-08 V3 OS prerequisites: make-uke-adt.py now emits /arm-io/wlan (qcom,wcn6750, local-mac-address) because 24A446's wifid matches that node; the build's adt_sha256 moves from 613a3486 to 74000706, which the packaging asserts. patches/xnu-12377/uke-wifi-association-event.patch is sheng's 33-line change to kev_post_msg verbatim: for KEV_VENDOR_APPLE + KEV_IEEE80211_CLASS the limit becomes MCLBYTES and the message uses m_getcl, so the 540-byte association result (fields at 0x214/0x218) fits. It applies with -390 lines of offset to this tree; every other class keeps MLEN.",
  "2026-11-08 V2 puts the stack under the module's own lifecycle. nw_wifi.c gains an NW_PLATFORM_AHB branch that skips ath12k_wifi7_pci_init/mhi_init_hook/nw_qrtr_mhi_register/pci_state/wmi_stuck/log_tap and the ath12k-only globals (nw_wifi_stats and nw_wifi_hw_ready stay with nw_mainline.c, which owns them in this image), and starts through nw_ahb_start()/nw_ahb_stop(). nw_wifi_step/poll/wait_ms/irq_mode/irq_pending are unchanged, so nw_wifi_control_poll() is now on the worker path for the first time. The four diagnostics move out of the board into src/nw_diag_ahb.c, implemented against ath11k structures (hal srng free counts, reo_dst/tx completion rings, station status); nw_wifi_link_state carries no rate because this tree has no ath12k_dp_link_peer_get_sta_rate_info_stats equivalent (recorded deviation). Board WifiAth11kState.c is retired.",
  "2026-11-08 V2 board boundary: the board fills struct nw_board (bar from nw_board_bar(), irq_base 0x400, map_phys, no cfg space), installs lx_platform, registers the control socket, then calls nw_wifi_start(&gPlatform, &board); the WPSS worker loop calls nw_wifi_step() (which owns lx_pump, so the board no longer pumps separately) and prints nw_wifi_ring_state every 5 s. MSI bitmaps go through nw_wifi_irq_pending(), ring inventory through the module. Every symbol the board references must be in the rename keep list: the first link failed on nw_board, nw_wifi_set_platform, nw_control_begin and nw_control_decode after objcopy renamed them to _nwk*.",
  "2026-11-08 device D61F closes the RX-assertion phase: PMK8550 GPIO3 was still an unwritten plain GPIO (mode00 vin00 pull04 source00 enable80) and after the board wrote func1/no-bias/VIN0/output-enable (mode01 pull05 source02 enable80) the firmware completed a whole scan, scan done reason0 at93.459782s, BSS snapshot20. SPI mask0001002f, DP group6 served by IRQ1040 with NAPI, and no whalRxMpduPop or whalRecvDmaLeak assertion through364.846024s. The refill ring TP=2110 that earlier candidates treated as exhaustion is also present in this successful scan and is not by itself a fault indicator; neither is the shared MAC129 HP=0.",
  "2026-11-08 P0 firmware dispatch: the board fwGet answered every non-regdb name with bd_o82.elf (59952B), so ath11k's API-2 board-2.bin container parsed an ELF. The D61F log shows board-2.bin requested three times at51.630-52.545s and rejected each time with 'found invalid board magic', then board.bin answered 59952B and the stack logged 'boot using board api 1'; amss.bin and m3.bin are never requested because WPSS PAS loads the firmware from modem_a through modem:qca6750/wpss. The dispatch now compares the basename and answers only board.bin (BDF type1) and regdb.bin/regdb_xiaomi.bin (REGDB type4), returning ENOENT for everything else and logging one 'fw request <name> -> <answer>' line per distinct name so the actual request set stays visible.",
  "2026-11-08 preemption callbacks: _disable_preemption/_enable_preemption are out-of-line global symbols in the 24A446 kernel image at 0xfffffff00af21308 and 0xfffffff00af2144c (llvm-nm on kernel-final.macho), so the board binds the kernel pair instead of the previous empty callbacks and the shared lx_shared_spin_lock boundary is no longer preemptible between the atomic and the payload copy. The board object imports both symbols and the link resolves them; lx_spin_enter/leave pair per acquisition and lx_shared_spin_trylock leaves on failure, so the counter cannot underflow.",
  "2026-11-07 uke board DMA: reuse sheng WifiProbe allocation and coalescing in the existing 48MiB uncached 32-bit IOVA window. Refuse an absent uncached alias and out-of-window mappings; require all 32 hardware MSI vectors and report actual SPI counts. Linux and the OEM WCN6750 entry both use rxdma1_enable=false. This corrects the board DMA contract; the whalRxMpduPop firmware assertion still needs a device retest.",
  "2026-11-06 MSI delivery root cause: the firmware's doorbell write was already landing in the polled sink page (24 records of 0x322 from 71.463s in boot-20261106-201200), but pollMsiSink was only called next to lx_pump in the board's main loop, while ath11k's entire core_start (htc.c:534 htc_wait_target, htc.c:672 connect_service) is synchronous and only yields through lx_pump -> lx_platform.poll, which then moved GLINK only. A firmware MSI therefore could not be observed or dispatched during start, so complete(&htc->ctl_resp) never ran and the wait timed out with -110. 0x322 = ep_base_data 0x320 + vector 2, and the WCN6750 service map puts HTC (RSVD_CTRL) and WMI_CONTROL target->host on CE2 with ath11k_htc_rx_completion_handler. Independently, the AHB hybrid hif ops install no get_ce_msi_idx (only pci.c:916 does), so hif.h falls back to msi_data_idx = ce_id: firmware data is 0x320 + ce_id while the host registers at compacted indices; CE0-CE3 agree and CE4/CE6 send no MSI, which covers the whole bring-up path.",
  "2026-11-07 debug-mask readback of 1497FEF9FCB11D48 opens the whole WMI sequence for the first time: WMI_INIT, then pdev set param 34/10/35/143/1/2, SCAN_PROB_REQ_OUI, two SCAN_CHAN_LIST commands (72 and 30 channels), LRO_CONFIG, pdev set param 44 (IDLE_PS_CONFIG=1) and finally VDEV_CREATE. Every one of them is consumed by the firmware on the same ~11 ms credit round trip, and VDEV_CREATE is followed by an MSI on vector 3 (CE3, the host->target WMI source ring). After that there are zero credit returns, zero MSIs on any vector, 1054 insufficient-credit lines, four WMI timeouts and the WPSS assert. This confirms the credit mechanism, the CE3 doorbell and the static window arithmetic are all correct and localises the stall to the firmware handling of vdev create. The crash record is truncated to 40 characters; the firmware string table in wpss.b06 carries whal_wmac_transition_to_fw_control as the only name with that prefix, and its neighbours are whal_wmac_phy_off_check, whal_wmac_h2s_grant_check (Polling H2S_GRANT_ISSUED failed) and the IMPS/HW-DTIM enter paths, i.e. the MAC low power recipe rather than the WMI parser. The host enables exactly that recipe 110 ms earlier with WMI_PDEV_PARAM_IDLE_PS_CONFIG from ath11k_mac_op_start, before any interface exists. The previous mbssid hypothesis is refuted: the firmware advertises wmi_ext2_service__bitmap[3] = 0x400020, i.e. bit 253 WMI_TLV_SERVICE_MBSS_PARAM_IN_VDEV_START_SUPPORT, so it claims to accept the 8 extra bytes.",
  "2026-11-07 upstream cross-check of the WMI stall (read-only, mainline v7.0.14 vs OEM 6.1.68), no behaviour changed: (a) the WCN6750 static window arithmetic is correct for this board -- HAL_SEQ_WCSS_UMAC_OFFSET 0x00a00000 and hal_seq_wcss_umac_ce0_src_reg 0x01b80000 both mask to 0 under ATH11K_PCI_WINDOW_RANGE_MASK 0x7ffff, so DP lands in [0x80000,0xfffff] and CE in [0x100000,0x17ffff], inside the 2 MiB BAR that DEVICE_INFO reports (0x61e00000 size 0x200000) and disjoint from each other; the shadow area 0x504+36*4 is below WINDOW_START and takes the direct path. The suspected HP mis-write is therefore excluded. (b) Re-reading boot-20261107-022026 in time order shows the WMI_VDEV_CREATE_CMDID DID consume a credit and WAS read by the firmware: msi vector 3 (CE3, the host->target WMI source ring) fires at 59.132 s, one line after the last of the 13 credit returns at 59.125 s, and no failed-to-create-vdev line exists, while the very next command (the first WMI_VDEV_SET_PARAM_CMDID, WMI_VDEV_PARAM_TX_ENCAP_TYPE) never gets a credit. The credit flow therefore stops while the firmware handles vdev create, not at the first command and not because of the source-ring offset. (c) The only wire-format divergence found between our tree and the OEM 6.1.68 kernel in that command path is exactly the command that stalls: wmi_vdev_create_cmd is 10 u32 (TLV_LEN 36) upstream and 8 u32 (TLV_LEN 28) in OEM because of mbssid_flags/mbssid_tx_vdev_id. Every other structure used before the stall (wmi_pdev_set_param_cmd, wmi_vdev_set_param_cmd, wmi_scan_chan_list_cmd, wmi_pdev_set_ps_mode_cmd) is field-identical, the sampled wmi_tlv_cmd_id/wmi_tlv_tag values match, and the pdev/vdev param numbers match (PMF_QOS 34, DYNAMIC_BW 10, TX_ENCAP 48, RX_DECAP 91). Hypothesis (unverified): this firmware evaluates vdev create with the 28-byte TLV, the 8 extra bytes make it fail, and it asserts in whal_wmac_recipes.c:whal_wmac_transition_to_fw_c instead of returning credits.",
  "2026-11-07 device readback of DA4FC79592169588 (HTC trailer trace) corrects the credit story: the firmware DOES send ATH11K_HTC_RECORD_CREDITS (trailer id 1, len 4) and the port parses it, giving 13 credit returns of 1 each between 58.87 s and 59.125 s. The returns then stop permanently immediately after an MSI on vector 3 (CE3). 5435 subsequent sends report 'need 1 have 0', WMI command 20488 times out three times and 20482 once, selftest scan returns -11, and the firmware asserts in whal_wmac_recipes.c:whal_wmac_transition_to_fw_c. msi mask stays 0000000e with ce0-8 counts 0 1 21 1, so interrupts keep arriving while no command is consumed.",
  "2026-11-07 device readback of 951A343605E803D3 quantifies the WMI stall: htc target credits 1 size 2176, Control/HTT get 0, WMI gets 1, and after the first command 5469 consecutive 'htc ep 2 short of credits: need 1 have 0' entries accumulate with no credit report processed anywhere in the boot (no credit report line and no 'Unhandled record' warning). Three wmi command timeouts (20488 VDEV_SET_PARAM, 20482 VDEV_DELETE) follow and the self-test scan returns -11; the firmware asserts in whal_wmac_recipes.c:whal_wmac_transition_to_fw_c. The total-credit value of 1 comes from ath11k_htc_wait_target's supports_shadow_regs clamp (WCN6750 has supports_shadow_regs = true), which is upstream behaviour.",
  "2026-11-07 device readback of EA1DA3D02D2354B9: the default wlan interface is present (station primary present, stage 4) and the machine reaches the desktop, but the board self-test scan fails with -11 before any scan command reaches ath11k_mac_op_hw_scan. wmi_cmd_send's tx_credit wait (3 s) expires three times for WMI_VDEV_SET_PARAM_CMDID and once for WMI_VDEV_DELETE_CMDID (20482=0x5002); the firmware then asserts in whal_wmac_recipes.c:whal_wmac_transition_to_fw_c. msi mask rises from 0 to 0000000e, so CE1/2/3 deliver interrupts. No scan, association or DHCP evidence exists in this boot.",
  "2026-11-07 device readback of A7E3489A864DF276 confirms the initcall diagnosis: control transport installed, cfg80211 init 0, mac80211 init 0 at 51.12 s, and zero 'ieee80211 registration failed' or 'failed register the radio' lines in the whole boot (previously the terminal failure). Registration advanced into device_add and stopped at 'bug at shim/src/lx_rt.c:484', the get_device BUG_ON, because nw_ahb.c's platform_device_register_full only set of_node and never initialised g_pdev.dev, which ath11k hands to mac80211 as the wiphy parent. The system was not wedged (log reaches 338 s), but pdev registration did not complete and fw ready stopped at pdev_create.",
  "2026-11-07 root cause of ieee80211_register_hw -EINVAL: not the HE-40MHz consistency check. Device readback of 40170704B812E936 shows both sides agreeing (phy2g0 carries bit 0x02, band-1 phy0 carries 0x04, ht40 1 he40 1, raw WMI TLV len 236), and HT40 alignment never fired. Instruction-level scanning of kernel-final.macho shows zero callers for lx_init_cfg80211_init, lx_init_ieee80211_init, lx_root_init and nw_wifi_control_transport_set, while the same scanner finds the expected caller for ieee80211_register_hw. Their only upstream caller is nw_wifi_start in src/nw_wifi.c, which build-ath11k-wifi.py excludes. Without cfg80211_init, wiphy_sysfs_init never runs, ieee80211_class is unregistered, and device_add returns -EINVAL from shim/src/lx_rt.c:508.",
  "2026-11-06 mac80211 registration -EINVAL localized to the one silent return in ieee80211_register_hw (Linux 7.0.14 main.c:1306-1313: an HE station entry declaring HT 40 MHz without the matching HE PHY 40 MHz bit). Every other -EINVAL in that function sits inside WARN_ON and would have printed through lx_warn; the boot log had zero 'warning at' lines, and disassembly shows only two bare mov w0,#-0x16 (the shared silent return and ieee80211_init_cipher_suites, which cannot fire because ath11k sets cipher_suites). ath11k sets IEEE80211_HT_CAP_SUP_WIDTH_20_40 unconditionally whenever the firmware enables HT, so the two sides can disagree on this firmware.",
  "2026-11-06 MSI dispatch verified on device (1115B4ECEC8AC40E): decoding the sink inside lx_platform.poll delivers the firmware interrupt through the pump nested in every synchronous wait, so HTC target and HTT connect complete (no timeout lines) and the whole system stays up. The AHB hybrid hif ops still lack get_ce_msi_idx, so CE5's doorbell (0x325) is dispatched to CE7's handler; harmless during bring-up but must be fixed before WMI traffic. ath11k_core_pdev_create then fails with -EINVAL from ieee80211_register_hw; the reachable silent branch is mac80211's HE-40MHz consistency check, and zero lx_warn output rules out every WARN_ON validation.",
  "2026-11-06: seven source repositories branched from the latest local GPU checkpoint. WPSS board glue and upstream protocol cores are integrated into the formal kernel; network data-path implementation remains planned.",
  "B883 logs both CE0_DST_CTRL and REO1_MISC as 0x170acce5. This does not establish usable registers. Follow-up streams modem FAT REGDB and O82 BDF after exact length and SHA256 checks. The original ath11k 0x25 descriptors handle 4 REGDB and 10 BDF segments. Firmware init indications and before/after MMIO values are recorded.",
  "82C2 device accepted IND_REGISTER/HOST_CAP and returned CAP 0x1d without a board ID, plus BAR 0x61e00000 length 0x200000. The follow-up reads only REO1_MISC and CE0_DST_CTRL for that exact BAR tuple. OEM module analysis indicates bd_o82.elf for product11/CN with no firmware board ID.",
  "49A7 device returned a matched CAP transaction with result1/error90 (INCOMPATIBLE_STATE). The follow-up uses the original ath11k fixed-memory IND_REGISTER/HOST_CAP order before CAP/DEVICE_INFO. The peer fixture checks the original wire fields and success gates.",
  "983B device readback confirms signed load and PAS reset, stage11/slave6, IPCRTR link1 and WLFW 45/13/8/301. There are129 new valid slots against the D774 readback.",
  "The read-only observer issues CAP 0x24 then DEVICE_INFO 0x4c. The original decoder gets only bounded TLVs and matched endpoint/transaction responses. The peer check covers normal replies, stale replies, timeout, malformed replies and firmware errors.",
  "All21 upstream ath11k core/AHB translation units compile for arm64e iPadOS27. Kernel integration currently uses the identity codec only. Board platform, SMMU/DMA and MSI imports remain to be implemented for the full backend.",
  "D774 device photo identifies PC0xfffffff00b6aa228 as bzero+0x48/DC ZVA and LR0xfffffff00b63f5c0 as loadSegments+0x208. Candidate is DO_NOT_FLASH. Recovery readback contains1 new valid slot/2047 unchanged and ends at52.600944s, with no Wi-Fi-stage record; it does not establish WPSS progress.",
  "The repair replaces only mapped WPSS destination copies/zeroing with volatile aligned32-bit stores and byte heads/tails. One focused ASan/UBSan check loads all11 stock segments across the full25MiB guarded reservation and verifies file bytes, zero BSS, untouched gaps and guard-boundary tails. Mapping, metadata and PAS error handling remain unchanged; device acceptance pending.",
  "The focused ASan/UBSan check verifies78 original file pins and17 unchanged protocol files; the actual firmware parses as ELF32,11 nonoverlapping load segments,8198565 file bytes,26214400-byte span, and4844 metadata bytes identical to stock MDT.",
  "2026-11-06 source review: stock live DTS, Uke DTBO and qca_cld3_qca6750.ko identify WCN6750 with WPSS and SMEM GLINK IPCRTR. Ath12kWifi main28de7b91 and sheng main46017956 target WCN7850 PCIe/MHI and cannot be enabled as a drop-in hardware driver. Public mac80211/cfg80211, 24A446 WifiNet, supplicant and Qcom transport helpers are reuse candidates; WCN6750 needs an ath11k AHB/hybrid backend. That initial source-review phase performed no runtime integration or hardware validation.",
  "2026-11-06 90C23: the stock regulatory database was accepted in full and the board file stalled at its third segment with no QMI reply. Read-only apps-SMMU reports show sCR0=0x002e0406 (USFCFG set), gfsr=0, idr0=0x4c017e6e, idr1=0x60000047 (71 banks, 128 global pages) and no stream-match entry for WLAN SID0x1400. The missing mapping does not by itself raise a recorded fault, so the BDF stall remains unresolved.",
  "2026-11-06 SMMU writes are unsafe on this platform: two bypass route candidates (8CA85D custom masked SMR, 6CF650 touch-proven helper) froze the whole system during Wi-Fi start, while the read-only survey C155848 booted to the desktop. Do not retry SMR/S2CR modifications under live storage/touch traffic; a real stage-1 context for SID0x1400 is the documented DMA path.",
  "2026-11-06 official-doc alignment: porting/network prescribes nw_abi/nw_wifi/WifiProbe/WifiNet and a DMA reachability checkpoint before scan; porting/platform requires PA-to-IOVA, SMMU instance/stream ownership and cache policy per DMA device. uke currently implements only the WPSS/QMI hardware-control layer; the ABI, worker, OS interface and DMA/MSI checkpoints are still missing."]
completion = ["WPSS ready and WLFW discovery, then ath11k DMA/MSI and scanning, then 24A446 WifiNet/supplicant association, DHCP and sustained bidirectional traffic, each with device evidence."]
limits = ["V4.7 passed AMFI category5 launch validation, opened85 native control sessions, but persisted81 initial INFO timeouts and driver-init failures. One join timed out after30s; no successful authorization/DHCP/traffic acceptance. Settings row missing. V4.8 was flashed to boot/vendor_boot A+B at2026-11-08T06:51:46+08:00, selectedA and rebooted successfully; no V4.8 user feedback or log readback yet. The prior stock/TWRP state belongs to the V4.7 recovery capture, not the latest deployment. No host userdata write."]
next_action = ["Wait for V4.8 device feedback, then capture a separately tagged ring against ukelog-20261108-063724-wifi-v47-readback.bin. Use bounded RX enqueue, worker dispatch and TX/socket results plus log-wifi queue stats to locate INFO loss; no assumption of which branch failed. After stable INFO, independently validate open association/DHCP, WPA2/EAPOL/keys, actual Settings entry and reconnect/cold boot. Canonical workspace handoff: docs/status/wifi-wcn6750-handoff-2026-11-08.md section8."]
evidence = [
