schema_version = 1

[device]
name = "uke"
soc = "SM7675"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Pad 7 (SM7675/cliffs) port: format-2 repository migration verified by a from-scratch kernel build; the bring-up runs through GPU mode 9, a real on-screen UI and touch scanning, with host-only migration verification on 2026-10-28."

[[area]]
id = "configuration"
status = "host-verified"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "configs/**", "patches/xnu/series", "proprietary-files.txt"]
inputs = ["Format-2 resolver of the shared UniXNU checkout (schema_version = 2).",
  "UniXNU-sm7675-common SoC layer and the ipados-17.7.11-21H461 OS profile.",
  "Catalog components with the board's fork pins in feeds.toml."]
configuration = ["board.toml: schema_version 2, soc_source sm7675, os_profile ipados-17.7.11-21H461, kit uke.",
  "The validated 68-patch set as one explicit series (device:patches/xnu/series).",
  "Nine board defconfigs; uke-gpu-userland_defconfig is the active GPU track."]
procedure = ["./unixnu defconfig uke-gpu-userland_defconfig -D ../UniXNU-uke-format2",
  "./unixnu fetch -D ../UniXNU-uke-format2 && ./unixnu status --json -D ../UniXNU-uke-format2",
  "./unixnu tree -D ../UniXNU-uke-format2"]
findings = ["The format-1 patch path never applied the shared patches from a cold tree (the board module shadowed them); the format-2 series replays the set statelessly.",
  "Catalog archive recipes equal the board's legacy builder commands; the component aliases keep the old script names working."]
completion = ["Status resolves arch, soc, os and device layers with the intended pins; the patch order lists 68 unique patches; the output path is out/uke/ipados-17.7.11-21H461/<config>/."]
limits = ["The five shared patches that the board series predates stay at their validated content; adopting the upstream evolutions needs a device-series rebase."]
next_action = ["Adopt the upstream shared-patch evolutions with a rebased device series and re-run the kernel comparison."]
evidence = [
  { kind = "host", reference = "board.toml", result = "schema_version 2 resolves with 23 component specs, 37 modules and a 68-entry patch order", command = "./unixnu status --json -D ../UniXNU-uke-format2", revision = "23c2926941405e7df8097a6bca6ee8348a39c787" },
  { kind = "source", reference = "patches/xnu/series", result = "the validated patch set in application order, shared entries prefixed arch:" },
]

[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["board.toml", "scripts/check-uke.py"]
inputs = ["Mu-Silicium UEFI checkout (uefi-uke) with the ukePkg platform.",
  "Payload FAT volume UKEESP with kernel.macho, its ADT and the trust cache."]
configuration = ["[firmware]: config uke, dsc Platforms/Xiaomi/ukePkg/uke.dsc, FD 3 MiB at FD_BASE 0xa7100000, ENABLE_SECUREBOOT=1, MEMORY_PROTECTION=TRUE."]
procedure = ["./unixnu build firmware --skip-preflight --uefi ../uefi-uke -D ../UniXNU-uke-format2",
  "fastboot boot boot.img (or flash vendor_boot+boot on the inactive slot)"]
findings = ["The boot manager displays the DT/initrd status through gUkeMemStatusGuid and the previous XNU panic line through the DXE memory driver.",
  "gUkeMemStatusGuid must be declared under [Guids] in both the DEC and the library INF."]
completion = ["The FD builds, the menu boots the payload entry, and the device reaches the XNU entry point."]
limits = ["Verification here is host-only; the format-2 chain has not yet been flashed."]
next_action = ["Flash the format-2 boot.img on hardware and confirm the menu and first boot match the previous image."]
evidence = [
  { kind = "device", reference = "docs/PROGRESS.md", result = "the firmware menu and the uke boot entry run on hardware through the bring-up images", command = "fastboot boot boot.img", revision = "c77d613dc91fb54479242aa5d5902c48662b80d7" },
  { kind = "host", reference = "board.toml", result = "SILICIUM_UEFI.fd builds 3,145,728 bytes with the board defines", command = "./unixnu build firmware --skip-preflight --uefi ../uefi-uke -D ../UniXNU-uke-format2", revision = "4f4bf7e1f4ad56743562777becd7ac7d6714216c" },
]

