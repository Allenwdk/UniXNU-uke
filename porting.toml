findings = ["2026-11-09 identity/touch retry starts from local main9198a6f4 and core558a7474 on fix/uke27-identity-touch-retry-20261109. Only J820 product identity and upstream HID pin are retried; board scale2,999B args,5 existing CA fixups,GPU/Wi-Fi/addon/trust/Data inputs remain. Prior experiments preserved separately; no flash.",
  "The format-1 patch path never applied the shared patches from a cold tree (the board module shadowed them); the format-2 series replays the set statelessly.",
  "Catalog archive recipes equal the board's legacy builder commands; the component aliases keep the old script names working.",
  "P2 (gpucomp26): the compositor's two-plane 'b3a8' frame is scanned by the DPU natively. Plane 0's 4 B/texel colour words (rows 4*width apart) are XRGB2101010, whose SSPP SRC_FORMAT 0x000276ff is the firmware's own ARGB8888 word 0x000237ff (unpack 0x03020001) with alpha bit 8 clear and DX bit 14 set, per the stock dpu_hw_sspp_setup_format/dpu_formats.c in the reference kernel; plane 1 is the alpha byte, whose row is the record's stride field. The 34,177,024-byte frame maps only its 27,340,800-byte plane-0 prefix into one slot; the CPU decode remains the fallback when the display-bank window is unavailable.",
  "gpucomp26 log (recovery, userdata window, t=16..917 s): UKE DPU: direct ready fmt=000237ff/000237ff unpack=03020001 tenbit=000276ff; four b3a8 frames mapped by their plane-0 prefix (direct slot ... bytes=27340800); UKE DPU: tenbit sample p0=18060180 p0c=37edfb7e alpha=ff/ff -- the alpha plane is 0xFF, so the frame is opaque and the XRGB2101010 word order is the right one. One stall snapshot at t=78.4 s and none after; GPU commit-to-complete still averages 50.9 ms over 8884 commits in 893 s (about 9.9/s).",
  "gpucomp27 ports the upstream display's refresh tick (GopFramebuffer 33e941a): startVsync/vsyncTick/armVsync, getRefreshAttributes at slot 301 and setDisplayRefreshProperties in registerService, with the builder binding _native_legacy_vsync_notify (0xfffffff005796720) and _native_legacy_set_refresh_properties (0xfffffff00579ebb8) after checking the original bytes; board.toml sets sheng-vsync=120 (armcpu-diagnostics dropped to stay at 987 of 1000 command-line bytes). The direct path now prints UKE DPU: flip n=... tb=... skip=... fb=... latch=...us max=...us vsync=... every 120 frames and the first eight UKE DPU: skip lines, so the next log separates compositor starvation from display-path loss.",
]
completion = ["Status resolves arch, soc, os and device layers with the intended pins; the output path is out/uke/ipados-27.0.1-24A446/uke_ipados27/; kernel.macho is MH_FILESET/arm64e and prelinks against the 24A446 kernelcache."]
