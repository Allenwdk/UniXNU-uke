# Extra sources of the uke build tree; the base feeds.toml supplies the rest.
[[source]]
name = "IOStorageFamily"
kind = "refer"
git = "https://github.com/apple-oss-distributions/IOStorageFamily.git"
ref = "main"
commit = "e45fbe30a7879e0b16e26dddb78538f1b00e0bff"

# The SM7675 (cliffs) SoC layer, shared with future boards. Local until the
# repository is published; the commit pin replaces the local override then.
[[source]]
name = "sm7675"
kind = "soc"
git = "https://github.com/Allenwdk/UniXNU-sm7675-common"
commit = "98618c197e789acfd7ac6755ad23bf7e04881780"
local = "../UniXNU-sm7675-common"

# Board-pinned component variants: the canonical GPU modules carry the uke
# integration branches, and the UFS and touch sources are the board's own
# copies. Everything else resolves through the catalog. The Native*
# repositories are kept only as history/fallback; no build reads them.
[[source]]
name = "Adreno740"
kind = "driver"
git = "https://github.com/UniXNU/Adreno740.git"
# uke-a732-parity: Adreno740 feat/ipados27-gpu-parity (90b52bf) plus the
# board's A732/GMU/31-bit-window/BO-teardown patches.
commit = "2f7a15654109b4bc940afacf01a5a15eac119d02"
local = "../UniXNU/drivers/Adreno740"

[[source]]
name = "GopFramebuffer"
kind = "driver"
git = "https://github.com/UniXNU/GopFramebuffer.git"
# Pure upstream feat/ipados27-gpu-parity: no uke display patches in the
# default build (local-only paths stay in uke-display-quirks).
commit = "7f7ae1e129113b4880c8f2039b398cdad15cb3f2"
local = "../UniXNU/drivers/GopFramebuffer"

[[source]]
name = "AdrenoMetal"
kind = "driver"
git = "https://github.com/UniXNU/AdrenoMetal.git"
commit = "739de5b622cee3b441f07826d6d4fface0a1fc19"
local = "../UniXNU/drivers/AdrenoMetal"

[[source]]
name = "ShengUfs"
kind = "driver"
local = "drivers/NativeUfs"

[[source]]
name = "ShengNovatekTouch"
kind = "driver"
