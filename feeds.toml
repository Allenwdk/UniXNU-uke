# Extra sources of the uke build tree; the base feeds.toml supplies the rest.
[[source]]
name = "IOStorageFamily"
kind = "refer"
git = "https://github.com/apple-oss-distributions/IOStorageFamily.git"
ref = "main"
# IOStorageFamily-337.100.1: the public source API the source-storage runtime compiles against
# (scripts/build-sheng-source-storage.py pins the same revision). 315 (e45fbe3) is the 17-line tree.
commit = "7edb88fbae296fb7c8ce2f64e115e116e566d51c"

# The SM7675 (cliffs) SoC layer, shared with future boards. Local until the
# repository is published; the commit pin replaces the local override then.
[[source]]
name = "sm7675"
kind = "soc"
git = "https://github.com/Allenwdk/UniXNU-sm7675-common"
commit = "98618c197e789acfd7ac6755ad23bf7e04881780"
local = "../UniXNU-sm7675-common"

# Board-pinned component variants for the iPadOS 27 line: the canonical GPU and
# input modules are the upstream feat/ipados27-gpu-parity tips; the GPU driver
# stays out of the build (CPU rendering) but the display module supplies the
# 24A446 legacy-display backend. The touch source stays the board's own fork.
[[source]]
name = "Adreno740"
kind = "driver"
git = "https://github.com/UniXNU/Adreno740.git"
# Upstream feat/ipados27-gpu-parity tip (2026-10-30).
commit = "c0a2f392a49b7363b26811189cb62d7d0f9e4b8a"
local = "../UniXNU/drivers/Adreno740"

[[source]]
name = "GopFramebuffer"
kind = "driver"
git = "https://github.com/UniXNU/GopFramebuffer.git"
# Upstream feat/ipados27-gpu-parity tip (2026-10-30): the CPU path's display backend.
commit = "4975bc84eb87e16d629125dcffb30cc30dfd2d86"
local = "../UniXNU/drivers/GopFramebuffer"

[[source]]
name = "AdrenoMetal"
kind = "driver"
git = "https://github.com/UniXNU/AdrenoMetal.git"
# Upstream feat/ipados27-gpu-parity tip (2026-10-30); not built in the CPU milestone.
commit = "278333f4a5c8c026dec8e8c277c741c0d909cc77"
local = "../UniXNU/drivers/AdrenoMetal"

[[source]]
name = "ShengUfs"
kind = "driver"
git = "https://github.com/UniXNU/ShengUfs.git"
# Upstream feat/ipados27-gpu-parity: the source-storage UFS runtime and the
# display bank's stage-1 window live here now, not in the old NativeUfs fork.
commit = "78c93b0941896e0515c6abaad3ff0d88b50a78ca"

[[source]]
name = "ShengHidInput"
kind = "driver"
git = "https://github.com/UniXNU/ShengHidInput.git"
# Upstream feat/ipados27-gpu-parity: the 24A446 vtable discriminators.
commit = "24f1f3fbed6feff42e1ca02e2ce386a5c3c36da8"

[[source]]
name = "ShengNovatekTouch"
kind = "driver"
local = "drivers/NativeNovatekTouch"
