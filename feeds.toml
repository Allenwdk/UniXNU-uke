# Extra sources of the uke build tree; the base feeds.toml supplies the rest.
[[source]]
name = "IOStorageFamily"
kind = "refer"
git = "https://github.com/apple-oss-distributions/IOStorageFamily.git"
ref = "main"
commit = "e45fbe30a7879e0b16e26dddb78538f1b00e0bff"

# The SM7675 (cliffs) SoC layer, shared with future boards. Local until the
# repository is published; the commit pin replaces the local override then.
[[source]]
name = "sm7675"
kind = "soc"
git = "https://github.com/Allenwdk/UniXNU-sm7675-common"
commit = "98618c197e789acfd7ac6755ad23bf7e04881780"
local = "../UniXNU-sm7675-common"

# Board-pinned component variants: the A732 GPU fork and the overlay-present
# display fork keep the uke bring-up pins, and the UFS and touch sources are
# the board's own copies. Everything else resolves through the catalog.
[[source]]
name = "Adreno740"
kind = "driver"
git = "https://github.com/Allenwdk/NativeAdreno.git"
# The branch gpucomp37 was built from: the local A732 commits rebased onto
# upstream perf/gpu-smoothness (stall handling, retired-BO reaper, WPTR fence
# checks). f1a2aee is the older m9f-era tip and renders on the CPU here.
commit = "c9509066f5cf0f958a22077f214c15837d54191a"
local = "../UniXNU/drivers/NativeAdreno"

