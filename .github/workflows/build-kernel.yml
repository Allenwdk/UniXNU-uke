name: build-uke-kernel

# Builds the XNU kernels for the Xiaomi Pad 7 / POCO Pad X1 (uke, SM7675) on a
# macOS runner. The kernel step needs macOS: xnu's own makefiles are driven with
# xcodebuild and the iPhoneOS SDK, and MIG ships only inside Xcode. Linux stops
# at the missing MIG (see the piano port's LINUX-BUILD.md).
#
#   kernel  first-console kernel: corecrypto, ArmDTPlatform, ArmCpu, timer,
#           PAN, DT panic region and the GOP legacy display.
#   full    stage-6 kernel from configs/uke-full_defconfig: everything the
#           source-reproducible archive chain can supply, including NativeUfs
#           and NativeAES, plus mockfs, pthread, PMGR and the legacy display.
#           The hardware-qualification gates (storage ABI snapshots, verified
#           root policy bundles, VirtIO/RamBlock, owner-root, boot progress)
#           stay off; configs/uke-full-plus_defconfig lists them.
#
# Runner note: the piano port proved that macos-14 / Xcode 15.4 is too old
# (`-mach_msg2` is unknown and MIG has no SubSystem declaration). Use the
# current macos-latest (macOS 26, Xcode 26.x); do not pin macos-14.
#
# This workflow is dispatch-only: the push-time checks (syntax, patch series,
# host tests) live in .github/workflows/ci.yml. An explicit defconfig selects
# the kernel to build; the expensive macOS build is never started by a push.
#
# Both jobs restore the UniXNU out/ tree, the device firmware cache and the
# Homebrew download cache. The cache key is the exact source identity: fork
# commit, patch set, archive sources, board/config and this workflow. A patch
# change therefore misses the cache and starts from a clean tree; there is no
# restore-key that could fall back to a different patch state.

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Device defconfig to build'
        required: false
        default: 'uke-full_defconfig'

concurrency:
  group: build-uke-kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The cache key is the source identity: fork commit, patch set, archive
  # sources, board/config and this workflow. A patch change must miss the
  # cache and start from a clean tree; no restore-key may fall back to a
  # different patch state.
  CACHE_SCHEMA: v6
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  kernel:
    runs-on: macos-latest
    timeout-minutes: 240

    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: UniXNU-uke

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: Allenwdk/UniXNU
          ref: uke
          path: UniXNU

      - name: Record the UniXNU revision
        id: base
        working-directory: UniXNU
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore the Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('UniXNU-uke/.github/workflows/build-kernel.yml') }}
          restore-keys: brew-${{ runner.os }}-

      - name: Restore the build tree
        uses: actions/cache@v4
        with:
          path: |
            UniXNU/out
            UniXNU-uke/.cache
          key: unixnu-kernel-${{ env.CACHE_SCHEMA }}-${{ steps.base.outputs.sha }}-${{ hashFiles('UniXNU-uke/board.toml', 'UniXNU-uke/feeds.toml', 'UniXNU-uke/unixnu.lock', 'UniXNU-uke/configs/**', 'UniXNU-uke/scripts/**', 'UniXNU-uke/patches/**', 'UniXNU-uke/package/**', 'UniXNU-uke/drivers/**', 'UniXNU-uke/kits/**', 'UniXNU/patches/**', 'UniXNU-uke/.github/workflows/build-kernel.yml') }}

      - name: Report the runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
          xcrun -sdk iphoneos -find mig || echo 'mig not found for iphoneos'

      - name: Install the host tools
        run: |
          brew install cmake ninja unifdef llvm mtools dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

      - name: Verify the tools unixnu checks for
        run: |
          for tool in git make clang cmake ninja unifdef mtools dtc xcodebuild; do
            printf '%-10s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done

      - name: Fetch the Apple references
        working-directory: UniXNU
        run: |
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread \
                          corecrypto-2023 IOStorageFamily -D ../UniXNU-uke

      - name: Fetch the target IPSW members
        working-directory: UniXNU
        run: ./unixnu ipsw fetch -D ../UniXNU-uke

      - name: Bootstrap kernel and prelinked candidate
        working-directory: UniXNU
        # bootstrap_defconfig disables every device archive. Its outputs are
        # the compile records under build/xnu/ and the prelinked kernel.macho
        # that build-native-legacy-display.py uses as its original candidate.
        # CONFIG_XNU_BUILD_ARCHIVES is not set, so the board's archive list is
        # not run during this pass.
        run: |
          ./unixnu defconfig bootstrap_defconfig -D ../UniXNU-uke
          ./unixnu build kernel -D ../UniXNU-uke
          test -f out/uke/kernel/kernel.macho
          test -f out/uke/kernel/kernel.json
          mkdir -p out/uke/tree/build/native-prelink
          cp out/uke/kernel/kernel.macho \
             out/uke/tree/build/native-prelink/native-owner-mobile-graphics-candidate.macho
          cp out/uke/kernel/kernel.json \
             out/uke/tree/build/native-prelink/native-owner-mobile-graphics-candidate.json
          cp out/uke/kernel/kernel.macho \
             out/uke/tree/build/native-prelink/native-owner-ufs-cpu-desktop-v9-hid-init-candidate.macho
          cp out/uke/kernel/kernel.json \
             out/uke/tree/build/native-prelink/native-owner-ufs-cpu-desktop-v9-hid-init-candidate.json
          # Do not leave the bootstrap kernel where the result step would
          # upload it as the shipping kernel.
          rm -f out/uke/kernel/kernel.macho out/uke/kernel/kernel.json
          ls -l out/uke/tree/build/native-prelink/

      - name: Build the first-console archives
        working-directory: UniXNU
        # The first-console configuration does not opt in to the board archive
        # list, so its archives are built here explicitly.
        run: |
          workspace=out/uke/tree
          ( cd "$workspace" && python3 scripts/gen-touch-firmware.py )
          ( cd "$workspace" && python3 scripts/build-corecrypto-14.py )
          ( cd "$workspace" && python3 scripts/build-corecrypto-14.py --namespace )
          ( cd "$workspace" && python3 scripts/build-arm-driver.py ArmDTPlatform )
          ( cd "$workspace" && python3 scripts/build-arm-driver.py ArmCpu )
          mkdir -p "$workspace/build/display-analysis"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('out/uke/tree/build/display-analysis/mobile-graphics-legacy-abi.json')
          if not p.exists():
              p.write_text(json.dumps({'runtime_metadata_checkpoint_sha256': '3044c2beff552911605994c0dc7aa73182066cbb5aed0b396999ceeb5a96da2b'}) + '\n')
          PY
          ( cd "$workspace" && python3 scripts/build-native-legacy-display.py )
          ls -l "$workspace/build/corecrypto-2023/"*.a \
                "$workspace/build/armdt-platform/" "$workspace/build/armcpu/" \
                "$workspace/build/native-legacy-display/"

      - name: Build and prelink the first-console kernel
        working-directory: UniXNU
        run: |
          ./unixnu defconfig uke_defconfig -D ../UniXNU-uke
          ./unixnu build kernel -D ../UniXNU-uke

      - name: Record the result
        working-directory: UniXNU
        if: always()
        run: |
          mkdir -p ../artifacts
          if [ -f out/uke/kernel/kernel.macho ]; then
            cp out/uke/kernel/kernel.macho ../artifacts/
            cp out/uke/kernel/kernel.json ../artifacts/ 2>/dev/null || true
            shasum -a 256 out/uke/kernel/kernel.macho | tee ../artifacts/kernel.macho.sha256
          else
            echo "kernel.macho was not produced" | tee ../artifacts/MISSING.txt
          fi
          cp -r out/uke/logs ../artifacts/logs 2>/dev/null || true
          ls -l ../artifacts

      - name: Upload the kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uke-kernel
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  full:
    runs-on: macos-latest
    timeout-minutes: 240

    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: UniXNU-uke

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: Allenwdk/UniXNU
          ref: uke
          path: UniXNU

      - name: Record the UniXNU revision
        id: base
        working-directory: UniXNU
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore the Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('UniXNU-uke/.github/workflows/build-kernel.yml') }}
          restore-keys: brew-${{ runner.os }}-

      - name: Restore the build tree
        uses: actions/cache@v4
        with:
          path: |
            UniXNU/out
            UniXNU-uke/.cache
          key: unixnu-full-${{ env.CACHE_SCHEMA }}-${{ steps.base.outputs.sha }}-${{ inputs.defconfig || 'uke-full_defconfig' }}-${{ hashFiles('UniXNU-uke/board.toml', 'UniXNU-uke/feeds.toml', 'UniXNU-uke/unixnu.lock', 'UniXNU-uke/configs/**', 'UniXNU-uke/scripts/**', 'UniXNU-uke/patches/**', 'UniXNU-uke/package/**', 'UniXNU-uke/drivers/**', 'UniXNU-uke/kits/**', 'UniXNU/patches/**', 'UniXNU-uke/.github/workflows/build-kernel.yml') }}

      - name: Report the runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
          xcrun -sdk iphoneos -find mig || echo 'mig not found for iphoneos'

      - name: Install the host tools
        run: |
          brew install cmake ninja unifdef llvm mtools dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

      - name: Fetch the Apple references
        working-directory: UniXNU
        # IOStorageFamily supplies the public block-storage headers; the
        # other references feed the kernel scripts and the archive builders.
        run: |
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread \
                          corecrypto-2023 IOStorageFamily -D ../UniXNU-uke

      - name: Fetch the target IPSW members
        working-directory: UniXNU
        run: ./unixnu ipsw fetch -D ../UniXNU-uke

      - name: Bootstrap kernel and prelinked candidate
        working-directory: UniXNU
        # CONFIG_XNU_BUILD_ARCHIVES is unset in bootstrap_defconfig, so this
        # pass only produces the compile records and the prelinked candidate.
        run: |
          ./unixnu defconfig bootstrap_defconfig -D ../UniXNU-uke
          ./unixnu build kernel -D ../UniXNU-uke
          test -f out/uke/kernel/kernel.macho
          test -f out/uke/kernel/kernel.json
          mkdir -p out/uke/tree/build/native-prelink
          cp out/uke/kernel/kernel.macho \
             out/uke/tree/build/native-prelink/native-owner-mobile-graphics-candidate.macho
          cp out/uke/kernel/kernel.json \
             out/uke/tree/build/native-prelink/native-owner-mobile-graphics-candidate.json
          cp out/uke/kernel/kernel.macho \
             out/uke/tree/build/native-prelink/native-owner-ufs-cpu-desktop-v9-hid-init-candidate.macho
          cp out/uke/kernel/kernel.json \
             out/uke/tree/build/native-prelink/native-owner-ufs-cpu-desktop-v9-hid-init-candidate.json
          rm -f out/uke/kernel/kernel.macho out/uke/kernel/kernel.json
          ls -l out/uke/tree/build/native-prelink/

      - name: Seed the display ABI observation cache
        working-directory: UniXNU
        # audit-mobile-graphics-legacy.py accepts the recorded runtime
        # observation hash from its previous output when the GDB dump was
        # pruned. The observation is of the unchanged iPad7,1 original class,
        # not of the native uke kernel; uke pins the same kernelcache as sheng.
        run: |
          mkdir -p out/uke/tree/build/display-analysis
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('out/uke/tree/build/display-analysis/mobile-graphics-legacy-abi.json')
          if not p.exists():
              p.write_text(json.dumps({'runtime_metadata_checkpoint_sha256': '3044c2beff552911605994c0dc7aa73182066cbb5aed0b396999ceeb5a96da2b'}) + '\n')
          PY

      - name: Stage the inputs the board archive list reads
        working-directory: UniXNU
        run: |
          workspace=out/uke/tree
          ( cd "$workspace" && python3 scripts/gen-touch-firmware.py )
          mkdir -p "$workspace/.cache/firmware/kernelcache.macho"
          source=$(find out -name 'kernelcache.decompressed' -print -quit)
          test -n "$source"
          echo "kernelcache: $source"
          cp "$source" "$workspace/.cache/firmware/kernelcache.macho/kernelcache.release.ipad7.decompressed"

      - name: Build and prelink the full kernel
        working-directory: UniXNU
        # CONFIG_XNU_BUILD_ARCHIVES turns on the board archive list in
        # board.toml: corecrypto, ArmDTPlatform, ArmCpu, NativeAES with the
        # recorded original bindings, the public storage headers, the NativeUfs
        # bring-up transport, mockfs, PMGR, pthread and the legacy display.
        run: |
          ./unixnu defconfig "${{ github.event.inputs.defconfig || 'uke-full_defconfig' }}" -D ../UniXNU-uke
          ./unixnu status
          ./unixnu build kernel -D ../UniXNU-uke

      - name: Record the result
        working-directory: UniXNU
        if: always()
        run: |
          mkdir -p ../artifacts-full
          if [ -f out/uke/kernel/kernel.macho ]; then
            cp out/uke/kernel/kernel.macho ../artifacts-full/
            cp out/uke/kernel/kernel.json ../artifacts-full/ 2>/dev/null || true
            shasum -a 256 out/uke/kernel/kernel.macho | tee ../artifacts-full/kernel.macho.sha256
          else
            echo "kernel.macho was not produced" | tee ../artifacts-full/MISSING.txt
          fi
          cp -r out/uke/logs ../artifacts-full/logs 2>/dev/null || true
          for report in build/native-aes/bindings.json build/storage-abi/headers.json \
                        build/native-ufs/bindings.json build/native-ufs/compile.log \
                        build/native-legacy-display/build-report.json; do
            if [ -f "out/uke/tree/$report" ]; then
              mkdir -p "../artifacts-full/$(dirname "$report")"
              cp "out/uke/tree/$report" "../artifacts-full/$report"
            fi
          done
          ls -l ../artifacts-full

      - name: Upload the full kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uke-kernel-full
          path: artifacts-full/
          if-no-files-found: warn
          retention-days: 14
