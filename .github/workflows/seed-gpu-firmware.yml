name: seed-uke-gpu-firmware

# Copies the private gen71100 GPU firmware into a dedicated Actions cache so
# build-kernel.yml can embed it without redistributing it in Git. The archive
# travels as up to three repository secrets, because GitHub caps one secret at
# 48 KB and the base64 is ~120 KB:
#
#   UKE_GPU_FIRMWARE_B64_1  UKE_GPU_FIRMWARE_B64_2  UKE_GPU_FIRMWARE_B64_3
#
# Example (run in the device repository, where .cache/firmware/uke-gpu has the
# three files):
#
#   tar -czf /tmp/uke-gpu-firmware.tar.gz -C .cache/firmware/uke-gpu \
#       gen71100_sqe.fw gen71100_gmu.bin gen71100_zap.mbn
#   base64 -w0 /tmp/uke-gpu-firmware.tar.gz > /tmp/uke-gpu-firmware.b64
#   split -b 40143 -d -a 1 /tmp/uke-gpu-firmware.b64 /tmp/uke-gpu-firmware.b64.
#   gh secret set UKE_GPU_FIRMWARE_B64_1 < /tmp/uke-gpu-firmware.b64.0
#   gh secret set UKE_GPU_FIRMWARE_B64_2 < /tmp/uke-gpu-firmware.b64.1
#   gh secret set UKE_GPU_FIRMWARE_B64_3 < /tmp/uke-gpu-firmware.b64.2
#
# Bump the `key` input when the firmware changes; cache entries are immutable.
# The build job restores uke-gpu-firmware-* for the GPU defconfigs.

on:
  workflow_dispatch:
    inputs:
      key:
        description: 'Cache key suffix (bump when the firmware changes)'
        required: false
        default: 'v1'

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          # Same relative path build-kernel.yml restores: the cache version is
          # derived from the paths, so a root-level save never matches.
          path: UniXNU-uke

      - name: Decode the firmware secret
        env:
          UKE_GPU_FIRMWARE_B64: ${{ secrets.UKE_GPU_FIRMWARE_B64 }}
          UKE_GPU_FIRMWARE_B64_1: ${{ secrets.UKE_GPU_FIRMWARE_B64_1 }}
          UKE_GPU_FIRMWARE_B64_2: ${{ secrets.UKE_GPU_FIRMWARE_B64_2 }}
          UKE_GPU_FIRMWARE_B64_3: ${{ secrets.UKE_GPU_FIRMWARE_B64_3 }}
        run: |
          set -euo pipefail
          if [ -n "$UKE_GPU_FIRMWARE_B64" ]; then
            payload="$UKE_GPU_FIRMWARE_B64"
          else
            payload="$UKE_GPU_FIRMWARE_B64_1$UKE_GPU_FIRMWARE_B64_2$UKE_GPU_FIRMWARE_B64_3"
          fi
          test -n "$payload" || {
            echo 'UKE_GPU_FIRMWARE_B64_* is not set'; exit 1; }
          mkdir -p UniXNU-uke/.cache/firmware/uke-gpu
          printf '%s' "$payload" | base64 -d > "$RUNNER_TEMP/uke-gpu-firmware.tar.gz"
          tar -xzf "$RUNNER_TEMP/uke-gpu-firmware.tar.gz" -C UniXNU-uke/.cache/firmware/uke-gpu
          rm -f "$RUNNER_TEMP/uke-gpu-firmware.tar.gz"
          ls -l UniXNU-uke/.cache/firmware/uke-gpu

      - name: Verify the recorded pins
        working-directory: UniXNU-uke
        run: python3 scripts/check-uke-gpu.py --firmware-dir .cache/firmware/uke-gpu

      - name: Save the firmware cache
        uses: actions/cache/save@v4
        with:
          path: UniXNU-uke/.cache/firmware/uke-gpu
          key: uke-gpu-firmware-${{ inputs.key }}
