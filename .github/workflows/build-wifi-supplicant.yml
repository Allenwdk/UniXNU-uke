name: build-uke-wifi-supplicant

# Builds the native wpa_supplicant for the iPadOS 27 line on a macOS runner.
#
# The supplicant is a Mach-O userspace program: it needs the iPhoneOS userland
# SDK (stdlib.h, libSystem), xcrun and codesign, none of which exist on the
# Linux build host. The kernel, payload and vendor_boot stay local; this job
# produces exactly one input - the signed `/usr/libexec/unixnu-wpa_supplicant`
# binary that the board's Data addon installs (see
# UniXNU-uke-build/scripts/build-wifi-userspace.py and the wifi_tool keys in
# board.toml).
#
# Source: UniXNU/Ath12kWifi at the commit sheng pins (28de7b9), which carries
# tools/build-supplicant.py, userspace/ and the locked wpa_supplicant 2.12
# tarball identity. The driver's local uke branch is irrelevant here: the
# supplicant compiles from userspace/ only.
#
# Dispatch-only: nothing here runs on a push.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build supplicant or Apple launchd cache"
        type: choice
        options: [supplicant, cache]
        default: supplicant
      driver_commit:
        description: 'Ath12kWifi commit to build from'
        required: false
        default: '28de7b91d7a880682b777e0e3564245a99dbc3f5'

permissions:
  contents: read

jobs:
  supplicant:
    if: ${{ inputs.mode != 'cache' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: UniXNU-uke

      - name: Check out the Wi-Fi component
        uses: actions/checkout@v4
        with:
          repository: UniXNU/Ath12kWifi
          ref: ${{ inputs.driver_commit }}
          path: Ath12kWifi

      # fetch-sources.py's non-check path adds the locked paths with
      # `git sparse-checkout add`, which a fresh clone's cone mode rejects
      # ("specify directories rather than patterns"). Materialise the two locked
      # checkouts in non-cone mode here from tools/source-lock.json, download the
      # locked supplicant archive, then let the module's own --check verify it.
      - name: Materialise the locked sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, tarfile, urllib.request

          component = pathlib.Path('Ath12kWifi')
          lock = json.loads((component / 'tools/source-lock.json').read_text())
          for name in ('linux', 'freebsd'):
              source = lock[name]
              directory = component / 'deps' / name
              if not directory.exists():
                  # Shallow like the module's own fetch: the server ignores blob
                  # filters, and the supplicant build only needs the locked tree.
                  subprocess.run(['git', 'clone', '--depth', '1', '--branch', source['ref'],
                                  '--no-checkout', source['url'], str(directory)], check=True)
              subprocess.run(['git', '-C', str(directory), 'sparse-checkout', 'init', '--no-cone'], check=True)
              subprocess.run(['git', '-C', str(directory), 'checkout', '--detach', source['commit']], check=True)
              subprocess.run(['git', '-C', str(directory), 'sparse-checkout', 'set', '--no-cone', '--stdin'],
                             input='\n'.join(source['paths']) + '\n', text=True, check=True)
              head = subprocess.check_output(['git', '-C', str(directory), 'rev-parse', 'HEAD'], text=True).strip()
              if head != source['commit']:
                  raise SystemExit(f'{name}: expected {source["commit"]}, found {head}')

          supplicant = lock['supplicant']
          archive = component / 'deps' / supplicant['archive']
          if not archive.exists():
              partial = archive.with_suffix('.part')
              with urllib.request.urlopen(supplicant['url'], timeout=60) as response, partial.open('wb') as output:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      output.write(chunk)
              if hashlib.sha256(partial.read_bytes()).hexdigest() != supplicant['sha256']:
                  raise SystemExit('supplicant archive differs from the lock')
              partial.rename(archive)
          # --check verifies the extracted release tree, not just the archive.
          extracted = component / 'deps' / supplicant['directory']
          if not extracted.exists():
              with tarfile.open(archive) as package:
                  for member in package.getmembers():
                      path = (component / 'deps' / member.name).resolve()
                      if (not (member.isfile() or member.isdir()) or
                              extracted.resolve() not in (path, *path.parents)):
                          raise SystemExit('unexpected archive member: ' + member.name)
                  package.extractall(component / 'deps')
          PY
          python3 Ath12kWifi/tools/fetch-sources.py --check

      - name: Report the runner toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          clang --version | head -1

      - name: Build the supplicant for the iOS target
        run: python3 Ath12kWifi/tools/build-supplicant.py --target ios --jobs 4

      - name: Sign and record the service
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, plistlib, re, subprocess
          from pathlib import Path

          component = Path('Ath12kWifi')
          binary = component / 'out/wpa-ios/bin/wpa_supplicant'
          if not binary.is_file():
              raise SystemExit('no supplicant binary')
          entitlements = Path('entitlements.plist')
          entitlements.write_bytes(plistlib.dumps({'com.apple.private.security.no-container': True}))
          subprocess.run(['codesign', '--force', '--sign', '-', '--pagesize', '4096', '--identifier',
                          'org.unixnu.wifi.supplicant', '--entitlements', str(entitlements), str(binary)], check=True)
          subprocess.run(['codesign', '--verify', '--strict', str(binary)], check=True)
          detail = subprocess.run(['codesign', '--display', '--verbose=4', str(binary)], check=True,
                                  capture_output=True, text=True).stderr
          match = re.search(r'^CDHash=([0-9a-f]{40})$', detail, re.M)
          if not match:
              raise SystemExit('signed supplicant has no CDHash')
          build = json.loads((component / 'out/wpa-ios/report.json').read_text())
          report = {
              'built': True, 'target': 'ios27', 'driver_commit': subprocess.check_output(
                  ['git', '-C', str(component), 'rev-parse', 'HEAD'], text=True).strip(),
              'cdhash': match[1], 'bytes': binary.stat().st_size,
              'sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
              'identifier': 'org.unixnu.wifi.supplicant',
              'hardware_verified': False, 'supplicant': build,
          }
          Path('supplicant-report.json').write_text(json.dumps(report, indent=2) + '\n')
          Path('unixnu-wpa_supplicant').write_bytes(binary.read_bytes())
          print(json.dumps({k: report[k] for k in ('cdhash', 'bytes', 'sha256', 'driver_commit')}, indent=1))
          PY

      - name: Upload the signed service
        uses: actions/upload-artifact@v4
        with:
          name: uke-wifi-supplicant
          path: |
            unixnu-wpa_supplicant
            supplicant-report.json
            entitlements.plist
          if-no-files-found: error

  cache:
    if: ${{ inputs.mode == 'cache' }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: UniXNU-uke
      - uses: actions/checkout@v4
        with:
          repository: Allenwdk/UniXNU
          ref: 5dc00d201496a1e7a72d1f5db23f041eb94ace1c
          path: UniXNU
      - uses: actions/checkout@v4
        with:
          repository: Allenwdk/UniXNU-sm7675-common
          ref: feat/ipados27-gpu-parity
          path: UniXNU-sm7675-common
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the original 24A446 OS
        working-directory: UniXNU
        run: |
          set -euo pipefail
          brew install ipsw
          PYTHONPATH=scripts python3 - <<'FETCH' | tee /tmp/uke-os-member.txt
          from pathlib import Path
          from types import SimpleNamespace
          import tomllib
          import http.client, time
          import unixnu.ipsw as ipsw
          class RetryingRangeFile(ipsw.RangeFile):
              def _block(self, index):
                  for attempt in range(8):
                      try:
                          data = super()._block(index)
                          # Keep bounded metadata/read-ahead, not the entire 8 GiB OS.
                          while len(self.cache) > 8:
                              self.cache.pop(next(iter(self.cache)))
                          if index % 32 == 0:
                              print(f'OS range offset {index * self.block // (1 << 20)} MiB', flush=True)
                          return data
                      except (http.client.IncompleteRead, TimeoutError, ConnectionError) as error:
                          if attempt == 7:
                              raise
                          print(f'retry OS range {index}: {type(error).__name__}', flush=True)
                          time.sleep(min(2 ** attempt, 20))
          ipsw.RangeFile = RetryingRangeFile
          profile = tomllib.loads(Path('profiles/os/ipados-27.0.1-24A446/profile.toml').read_text())
          ctx = SimpleNamespace(board={'ipsw': profile['ipsw']}, out_root=Path('out'))
          print(ipsw.Ipsw(ctx, profile['ipsw']['url']).extract('OS'))
          FETCH
          OS=$(tail -1 /tmp/uke-os-member.txt)
          case "$OS" in
            *.aea)
              PLAIN=$(PYTHONPATH=scripts python3 -c 'import pathlib,sys; from unixnu.ipsw import decrypt_aea; print(decrypt_aea(pathlib.Path(sys.argv[1])))' "$OS" | tail -1)
              rm -f "$OS"
              OS="$PLAIN"
              ;;
          esac
          test -f "$OS"
          OS_ABSOLUTE=$(python3 -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve())' "$OS")
          echo "OS_IMAGE=$OS_ABSOLUTE" >> "$GITHUB_ENV"
      - name: Build and check the cache with Apple tools
        working-directory: UniXNU
        run: |
          set -euo pipefail
          mkdir -p os-mount wifi-daemons cache-device
          ln -s "$PWD/../UniXNU-uke/scripts" cache-device/scripts
          hdiutil attach -readonly -nobrowse -mountpoint "$PWD/os-mount" "$OS_IMAGE"
          trap 'hdiutil detach "$PWD/os-mount" || true' EXIT
          python3 - <<'PYCODE'
          import hashlib, plistlib
          from pathlib import Path
          source = Path('os-mount/System/Library/xpc/launchd.plist')
          expected = '7291b582e38f721c69474e266ee669a7f83cf62fe085b08c76dcc6f5e66a6016'
          if hashlib.sha256(source.read_bytes()).hexdigest() != expected:
              raise SystemExit('original 24A446 launchd cache identity mismatch')
          job = {'Label': 'org.unixnu.wifi.supplicant', 'ProgramArguments': [
              '/usr/libexec/unixnu-wpa_supplicant', '-Dsheng', '-ien0',
              '-c/private/var/ngpu/etc/wifi/wpa_supplicant.conf', '-q'],
              'RunAtLoad': True, 'KeepAlive': True, 'ThrottleInterval': 3,
              'UserName': 'root', 'Umask': 0o77, 'ProcessType': 'Interactive',
              'StandardOutPath': '/var/log/unixnu-wifi.log',
              'StandardErrorPath': '/var/log/unixnu-wifi.log'}
          Path('wifi-daemons/org.unixnu.wifi.supplicant.plist').write_bytes(plistlib.dumps(job))
          Path('cache-device/board.toml').write_text(
              '[payload.runtime.launchd_job_environment."com.apple.iconservices.iconservicesagent"]\n'
              'FORCE_SOFTWARE_RENDERER = "0"\nCI_ENABLE_METAL_GPU = "0"\n')
          PYCODE
          python3 ../UniXNU-uke/scripts/build-wifi-launchd-cache-macos.py \
            --core . --device cache-device \
            --source os-mount/System/Library/xpc/launchd.plist \
            --signature os-mount/System/Library/xpc/launchd.plist.sig \
            --daemons wifi-daemons --output wifi-cache
      - uses: actions/upload-artifact@v4
        with:
          name: uke-wifi-apple-cache
          path: |
            UniXNU/wifi-cache/launchd.plist
            UniXNU/wifi-cache/launchd.plist.sig
            UniXNU/wifi-cache/cache-report.json
          if-no-files-found: error
          retention-days: 14
